name: rolling-release

on:
  push:
    branches: ["main"]
    paths: ['**.js', '**.mjs', '**.cjs', '**.json', '**.html', '**.css', '.github/workflows/**']

  workflow_dispatch:

# GITHUB_TOKEN is used in forks without the GTOK secret, it needs to create the release
permissions:
  contents: write

env:
  SHD_VER: '6.1.0'
  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: setup node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: mcp tests
      run: |
        npm ci --prefix mcp --ignore-scripts
        npm test --prefix mcp

  linux-build:
    runs-on: ubuntu-latest
    needs: test

    outputs:
      linux_rel_id: ${{steps.linux_rel_id.outputs.artifact-id}}
      
    steps:
    - uses: actions/checkout@v7
    
    - name: setup node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: build linux
      env:
          GH_TOKEN: ${{ secrets.GTOK || secrets.GITHUB_TOKEN }}
      run: |
        npm i
        npm ci --prefix mcp --ignore-scripts
        npm run dist -- --publish never

    - name: upload release
      id: linux_rel_id
      uses: actions/upload-artifact@v7
      with:
        name: sharedown-linux
        path: dist/sharedown-${{env.SHD_VER}}.AppImage
        retention-days: 1

  win-build:
    runs-on: windows-latest
    needs: test

    outputs:
      win_rel_id: ${{steps.win_rel_id.outputs.artifact-id}}
      
    steps:
    - uses: actions/checkout@v7
    
    - name: setup node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: build win
      env:
          GH_TOKEN: ${{ secrets.GTOK || secrets.GITHUB_TOKEN }}
      run: |
        npm i
        npm ci --prefix mcp --ignore-scripts
        npm run dist -- --publish never

    - name: upload release
      id: win_rel_id
      uses: actions/upload-artifact@v7
      with:
        name: sharedown-win
        path: |
          dist/sharedown-${{env.SHD_VER}}-win.7z
          dist/sharedown-${{env.SHD_VER}}-setup.exe
        retention-days: 1

  mac-build:
    if: false
    runs-on: macos-latest

    outputs:
      mac_rel_id: ${{steps.mac_rel_id.outputs.artifact-id}}
      
    steps:
    - uses: actions/checkout@v7
    
    - name: setup node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: build macos
      env:
          GH_TOKEN: ${{ secrets.GTOK || secrets.GITHUB_TOKEN }}
      run: |
        npm i
        npm ci --prefix mcp --ignore-scripts
        npm run dist -- --publish never

    - name: upload release
      id: mac_rel_id
      uses: actions/upload-artifact@v7
      with:
        name: sharedown-mac
        path: |
          dist/sharedown-${{env.SHD_VER}}-mac.7z
          dist/sharedown-${{env.SHD_VER}}-arm64-mac.7z
        retention-days: 1

  publish_release:
    runs-on: ubuntu-latest
    needs: [win-build, linux-build]

    steps:
      - uses: actions/checkout@v7

      - name: get release artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{needs.win-build.outputs.win_rel_id}},${{needs.linux-build.outputs.linux_rel_id}}

      - name: remove old rolling builds
        env:
          GH_TOKEN: ${{ secrets.GTOK || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release list --limit 100 --json tagName,name
          -q '.[] | select(.name == "Sharedown rolling build") | .tagName'
          | xargs -r -I{} gh release delete {} --cleanup-tag -y

      - name: prepare release notes
        run: |
          cat > rel_notes.md <<'EOF'
          Compilación automática de la rama main (fork con servidor MCP).

          **Windows:** `sharedown-${{env.SHD_VER}}-setup.exe` (instalador) o `sharedown-${{env.SHD_VER}}-win.7z` (portable).
          El MCP se configura en *Settings → MCP server (Claude)*.

          **macOS:** sin compilación, usar desde el código (`npm start`).

          [Novedades del fork](https://github.com/${{ github.repository }}#novedades-de-este-fork)
          EOF

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GTOK || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create $(date '+%Y%m%d%H%M%S')
          "sharedown-linux/sharedown-${{env.SHD_VER}}.AppImage"
          "sharedown-win/sharedown-${{env.SHD_VER}}-win.7z"
          "sharedown-win/sharedown-${{env.SHD_VER}}-setup.exe"
          --draft=false
          --latest
          -t "Sharedown rolling build"
          -F rel_notes.md
